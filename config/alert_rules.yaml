alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000 ms'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602756
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestFailures
    severity: critical
    condition: 'request_failed / request_received > 2% OR retrieval success < 90%'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602756
    runbook: docs/alerts.md#alert-2
  - name: QualityOrCostGuardrail
    severity: warning
    condition: 'mean(quality_score) < 0.75 OR daily cost > 2.5 USD'
    duration: 10m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602756
    runbook: docs/alerts.md#alert-3
